appId: com.ecommerce
---
- clearState

- launchApp

- runFlow:
    file: ./pages/login_page.yml
    env:
      APP_ID: com.ecommerce
      USERNAME: "testuser"
      PASSWORD: "password123"

- runFlow:
    file: ./pages/catalogo_page.yml
    env:
      APP_ID: com.ecommerce
      PRODUCT_NAME: "Smartwatch 2"

- runFlow:
    file: ./pages/detalle_producto.yml
    env:
      APP_ID: com.ecommerce

- runFlow:
    file: ./pages/carrito_page.yml
    env:
      APP_ID: com.ecommerce
      PRODUCT_NAME: "Smartwatch 2"
      PRODUCT_VALUE: "\\$249.99"